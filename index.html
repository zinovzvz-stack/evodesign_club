<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>evodesign — Zino</title>
<style>
:root{
  --bg:#061025; --panel:#0e1726; --muted:#9aa4b2; --text:#e6eef6;
  --accent-from:#6d28d9; --accent-to:#ec4899; --radius:12px; --max-w:1100px;
  --mono:"Fira Code", monospace; --ease:cubic-bezier(.2,.9,.3,1);
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,Arial;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
.wrap{max-width:var(--max-w);margin:28px auto;padding:18px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;gap:12px;align-items:center}
.logo{width:56px;height:56px;border-radius:12px;background:linear-gradient(90deg,var(--accent-from),var(--accent-to));display:flex;align-items:center;justify-content:center;font-weight:800;font-family:var(--mono)}
nav{display:flex;gap:8px;align-items:center}
.btn{padding:8px 12px;border-radius:10px;background:transparent;border:1px solid rgba(255,255,255,0.04);color:var(--text);cursor:pointer;transition:.2s}
.btn:hover{opacity:.8}
.btn.primary{background:linear-gradient(90deg,var(--accent-from),var(--accent-to));border:none;color:#fff}
.hero{display:grid;grid-template-columns:1fr 420px;gap:22px;align-items:center;margin-top:18px}
.card{background:linear-gradient(180deg,rgba(255,255,255,0.02),transparent);padding:20px;border-radius:12px;backdrop-filter:blur(4px);box-shadow:0 10px 40px rgba(0,0,0,0.6)}
h1{margin:0;font-size:1.95rem}
.accent{background:linear-gradient(90deg,var(--accent-from),var(--accent-to));-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:18px}
.project-card{background:var(--panel);border-radius:10px;overflow:hidden;cursor:pointer;transition:transform .28s var(--ease),box-shadow .28s var(--ease),opacity .3s var(--ease);opacity:0;transform:translateY(20px);}
.project-card.show{opacity:1;transform:translateY(0);}
.project-card:hover{transform:translateY(-6px)}
.thumb{height:140px;background:#000}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.meta{padding:12px}
.meta h3{margin:0 0 6px 0}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tag{background:rgba(255,255,255,0.02);padding:6px 8px;border-radius:8px;font-size:12px;color:var(--muted)}
footer{margin-top:48px;text-align:center;color:var(--muted)}
.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:120}
.overlay.show{display:flex}
.backdrop{position:absolute;inset:0;background:rgba(2,6,23,0.85)}
.modal{position:relative;background:var(--panel);border-radius:12px;padding:18px;z-index:121;max-width:920px;width:94%;max-height:90vh;overflow:auto}
input,textarea{width:100%;padding:8px;border-radius:8px;border:1px solid rgba(255,255,255,0.03);background:transparent;color:var(--text);margin-bottom:8px}
input:focus,textarea:focus{outline:2px solid rgba(124,58,237,0.24);outline-offset:2px}
button{cursor:pointer}
.dashboard h3{margin:0 0 6px 0}
.dashboard .project-item{display:flex;justify-content:space-between;align-items:center;margin:6px 0;padding:6px 8px;border-radius:8px;background:rgba(255,255,255,0.02)}
.dashboard .project-item button{padding:4px 8px;font-size:12px}
.fadein{animation:fadein .3s ease forwards}
@keyframes fadein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:980px){.hero{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<header>
<div class="brand">
<div class="logo">ev</div>
<div>
<div style="font-weight:800">evodesign</div>
<div style="color:var(--muted);font-size:0.95rem">Zino — مطور واجهات</div>
</div>
</div>
<nav>
<button class="btn" id="openDashboardBtn">لوحة تحكم</button>
<button class="btn primary" id="addProjectBtn">إضافة مشروع</button>
</nav>
</header>

<main>
<section class="hero">
<div class="card">
<h1>أنا Zino — أبني واجهات <span class="accent">تفاعلية</span></h1>
<p class="lead" style="color:var(--muted);margin-top:10px">مزيج من دقّة المبرمج وذوق المصمم — أداء وتجربة مستخدم رائعة.</p>
</div>
</section>

<section id="projectsSection" class="card" style="margin-top:18px">
<h2 style="margin:0 0 10px 0">الأعمال</h2>
<div id="projectsGrid" class="grid" aria-live="polite"></div>
</section>

<footer><small>© <span id="year"></span> evodesign — Zino</small></footer>
</main>
</div>

<div id="overlay" class="overlay">
<div class="backdrop" id="overlayBackdrop"></div>
<div id="overlayContent" class="modal"></div>
</div>

<script>
(() => {
'use strict';
const DOM = {
overlay: document.getElementById('overlay'),
overlayBackdrop: document.getElementById('overlayBackdrop'),
overlayContent: document.getElementById('overlayContent'),
projectsGrid: document.getElementById('projectsGrid'),
openDashboardBtn: document.getElementById('openDashboardBtn'),
addProjectBtn: document.getElementById('addProjectBtn'),
year: document.getElementById('year'),
};
DOM.year.textContent = new Date().getFullYear();

// كلمة مرور لوحة التحكم
const PASSWORD = "ZINO";

let projects = JSON.parse(localStorage.getItem('evodesignProjects')||'[]');
if(!projects.length){
projects = [
{id:'p1',title:'Landing تفاعلية',desc:'صفحة هبوط سريعة مع أنيميشن.',img:'https://picsum.photos/800/500?random=1',tags:['HTML','Performance']},
{id:'p2',title:'Dashboard تحليلي',desc:'لوحة تفاعلية مع بيانات زمنية.',img:'https://picsum.photos/800/500?random=2',tags:['JS','Charts']}
];
localStorage.setItem('evodesignProjects',JSON.stringify(projects));
}

const escapeHTML = s=> String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const saveProjects = ()=>localStorage.setItem('evodesignProjects',JSON.stringify(projects));

function renderProjects(){
DOM.projectsGrid.innerHTML='';
projects.forEach(p=>{
const card = document.createElement('article');
card.className='project-card';
card.innerHTML=`<div class="thumb"><img src="${escapeHTML(p.img)}" alt="${escapeHTML(p.title)}"></div>
<div class="meta">
<h3>${escapeHTML(p.title)}</h3>
<p style="color:var(--muted);font-size:13px">${escapeHTML(p.desc)}</p>
<div class="tags">${p.tags.map(t=>`<span class="tag">${escapeHTML(t)}</span>`).join('')}</div>
</div>`;
DOM.projectsGrid.appendChild(card);
setTimeout(()=>card.classList.add('show'),20);
});
}

// Modal helper
const Modal = {
open(content){
DOM.overlayContent.innerHTML=''; DOM.overlayContent.appendChild(content);
DOM.overlay.classList.add('show');
function close(){ DOM.overlay.classList.remove('show'); DOM.overlayContent.innerHTML=''; }
DOM.overlayBackdrop.onclick=close;
document.addEventListener('keydown',function esc(e){ if(e.key==='Escape'){close();document.removeEventListener('keydown',esc);} });
return {close};
}
};

// طلب كلمة المرور قبل لوحة التحكم
function requireLogin(callback){
if(sessionStorage.getItem('evodesignLogged')){ callback(); return; }
const loginForm = document.createElement('div');
loginForm.innerHTML=`<h2>تسجيل الدخول</h2>
<input type="password" placeholder="أدخل كلمة المرور">
<div style="display:flex;gap:8px;margin-top:8px">
<button class="btn primary">دخول</button>
<button class="btn">إلغاء</button>
</div>`;
const modal = Modal.open(loginForm);
loginForm.querySelector('button.btn:not(.primary)').onclick = modal.close;
loginForm.querySelector('button.primary').onclick = ()=>{
const val = loginForm.querySelector('input').value;
if(val === PASSWORD){
sessionStorage.setItem('evodesignLogged','1');
modal.close();
callback();
}else{ alert('كلمة المرور خاطئة'); }
};
}

// Dashboard
function openDashboard(){
requireLogin(()=>{
const dash=document.createElement('div'); dash.className='dashboard';
dash.innerHTML=`<h2>لوحة التحكم</h2><div id="projectList"></div>`;
const modal=Modal.open(dash);
function renderList(){
const listDiv=dash.querySelector('#projectList'); listDiv.innerHTML='';
projects.forEach((p,idx)=>{
const item=document.createElement('div'); item.className='project-item fadein';
item.innerHTML=`<span>${escapeHTML(p.title)}</span>
<div>
<button data-id="${p.id}" class="editBtn">تعديل</button>
<button data-id="${p.id}" class="delBtn">حذف</button>
</div>`;
listDiv.appendChild(item);
});
dash.querySelectorAll('.editBtn').forEach(btn=>{
btn.onclick=()=>openProjectForm(projects.find(pr=>pr.id===btn.dataset.id), renderList);
});
dash.querySelectorAll('.delBtn').forEach(btn=>{
btn.onclick=()=>{
if(confirm('هل تريد حذف المشروع؟')){
const idx = projects.findIndex(pr=>pr.id===btn.dataset.id);
if(idx>-1){
const el = DOM.projectsGrid.children[idx];
el.classList.remove('show');
setTimeout(()=>{
projects.splice(idx,1);
saveProjects();
renderProjects();
renderList();
},300);
}
}
};
});
}
renderList();
});
}

// Project Form
function openProjectForm(p,callback){
const isNew=!p;
const form=document.createElement('div');
form.innerHTML=`<h2>${isNew?'إضافة مشروع':'تعديل مشروع'}</h2>
<input type="text" name="title" placeholder="العنوان" value="${p?p.title:''}">
<input type="text" name="img" placeholder="رابط الصورة" value="${p?p.img:''}">
<textarea name="desc" rows="3" placeholder="الوصف">${p?p.desc:''}</textarea>
<input type="text" name="tags" placeholder="وسوم مفصولة بفواصل" value="${p?p.tags.join(','):''}">
<div style="display:flex;gap:8px;margin-top:8px">
<button class="btn primary">حفظ</button>
<button class="btn">إلغاء</button>
</div>`;
const modal=Modal.open(form);
form.querySelector('button.btn:not(.primary)').onclick=modal.close;
form.querySelector('button.primary').onclick=()=>{
const title=form.title.value.trim();
const img=form.img.value.trim();
const desc=form.desc.value.trim();
const tags=form.tags.value.split(',').map(t=>t.trim()).filter(Boolean);
if(!title||!img||!desc){alert('املأ جميع الحقول'); return;}
if(isNew){
const id='p'+Date.now();
projects.push({id,title,desc,img,tags});
}else{
p.title=title; p.img=img; p.desc=desc; p.tags=tags;
}
saveProjects();
renderProjects();
if(callback)callback();
modal.close();
};
}

// الأحداث
DOM.openDashboardBtn.onclick=openDashboard;
DOM.addProjectBtn.onclick=()=>requireLogin(()=>openProjectForm(null,()=>{}));

renderProjects();
})();
</script>
</body>
</html>
