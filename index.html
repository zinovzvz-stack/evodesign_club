<!doctype html>

<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>EVODESIGN — لوحة تحكم متعددة اللغات</title>
  <meta name="description" content="EVODESIGN — نظام إدارة محتوى برتفوليو بلغة عربية وإنجليزية، مع تسجيل دخول وإمكانيات تصدير واستيراد." />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">  <style>
    :root{--bg:#050717;--card:#071428;--muted:#9aa4b2;--accent1:#06b6d4;--accent2:#7c3aed;--radius:12px}
    *{box-sizing:border-box}html,body{height:100%}body{margin:0;font-family:'Cairo',system-ui,Arial;color:#eaf6ff;background:linear-gradient(180deg,#020415,var(--bg));-webkit-font-smoothing:antialiased}
    a{color:inherit}

    .app{max-width:1400px;margin:18px auto;padding:18px;display:grid;grid-template-columns:300px 1fr;gap:18px}
    .sidebar{background:linear-gradient(180deg,rgba(255,255,255,0.02),transparent);border:1px solid rgba(255,255,255,0.03);padding:18px;border-radius:12px;height:calc(100vh - 40px);position:sticky;top:20px;overflow:auto}
    .brand{display:flex;gap:12px;align-items:center;margin-bottom:18px}
    .logo{width:56px;height:56px;border-radius:10px;background:linear-gradient(135deg,var(--accent1),var(--accent2));display:grid;place-items:center;font-weight:800;color:#021018}
    .nav{display:flex;flex-direction:column;gap:6px}
    .nav button{background:transparent;border:0;color:var(--muted);padding:10px;border-radius:8px;text-align:right;cursor:pointer}
    .nav button.active{background:linear-gradient(90deg, rgba(6,182,212,0.06), rgba(124,58,237,0.06));color:#fff}

    .main{overflow:auto;padding:12px}
    header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
    header h1{margin:0;font-size:20px}
    .controls{display:flex;gap:8px;align-items:center}
    .lang-toggle{display:flex;gap:6px}

    .card{background:linear-gradient(180deg,rgba(255,255,255,0.02),transparent);border:1px solid rgba(255,255,255,0.03);padding:14px;border-radius:12px}
    .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
    input,textarea,select{width:100%;padding:10px;border-radius:10px;background:transparent;border:1px solid rgba(255,255,255,0.04);color:inherit}
    textarea{min-height:120px}
    .btn{padding:10px 14px;border-radius:10px;border:0;background:linear-gradient(90deg,var(--accent1),var(--accent2));color:#021018;font-weight:700;cursor:pointer}
    .btn.ghost{background:transparent;border:1px solid rgba(255,255,255,0.04);color:var(--muted)}
    .small{padding:6px 8px;border-radius:8px;border:1px solid rgba(255,255,255,0.04);background:transparent;color:var(--muted)}

    .media-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
    .media-item{height:96px;border-radius:8px;background:#071226;background-size:cover;background-position:center;border:1px solid rgba(255,255,255,0.03);position:relative;overflow:hidden}
    .media-item button{position:absolute;left:6px;top:6px;background:rgba(0,0,0,0.5);border:0;color:white;padding:6px;border-radius:6px}

    .muted{color:var(--muted)}
    .toast{position:fixed;left:18px;bottom:18px;background:#021022;padding:10px 14px;border-radius:10px;border:1px solid rgba(255,255,255,0.04)}

    @media (max-width:1000px){.app{grid-template-columns:1fr;padding:12px}.sidebar{position:relative;height:auto}}
  </style></head>
<body><div class="app" role="application">
  <aside class="sidebar" aria-label="لوحة التحكم">
    <div class="brand"><div class="logo">E</div><div><div style="font-weight:800">EVODESIGN</div><div class="muted" style="font-size:13px">لوحة تحكم متعددة اللغات</div></div></div><div class="nav" role="navigation" aria-label="القائمة الرئيسية">
  <button data-route="dashboard" class="active">لوحة المعلومات</button>
  <button data-route="projects">المشروعات</button>
  <button data-route="courses">الدورات</button>
  <button data-route="media">الوسائط</button>
  <button data-route="pages">الصفحات</button>
  <button data-route="settings">الإعدادات</button>
  <button data-route="importexport">استيراد/تصدير</button>
  <button data-route="publish">نشر</button>
  <button id="btn-logout" style="margin-top:12px" class="small">تسجيل خروج</button>
</div>

<div style="margin-top:18px"><div class="muted">الوضع: تجربة</div><div class="muted" style="margin-top:8px">حفظ محلي ± يدعم التصدير للاستبدال السحابي</div></div>

  </aside>  <main class="main">
    <header>
      <h1 id="app-title">EVODESIGN Control</h1>
      <div class="controls">
        <div class="lang-toggle" role="tablist" aria-label="اختيار اللغة">
          <button id="lang-ar" class="small" aria-pressed="true">العربية</button>
          <button id="lang-en" class="small" aria-pressed="false">English</button>
        </div>
        <button id="btn-preview" class="small">عرض</button>
        <button id="btn-backup" class="small">تصدير</button>
      </div>
    </header><div id="view"></div>

  </main>
</div><div id="toast" class="toast" style="display:none"></div><!-- Login modal --><div id="login-modal" style="position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,0.6);z-index:60">
  <div style="background:var(--card);padding:20px;border-radius:12px;min-width:320px">
    <h3 id="login-title">تسجيل دخول</h3>
    <label class="muted">كلمة المرور</label>
    <input id="admin-pass-input" type="password">
    <div style="margin-top:10px;display:flex;gap:8px;justify-content:flex-end">
      <button id="login-ok" class="btn">دخول</button>
      <button id="login-cancel" class="btn ghost">إلغاء</button>
    </div>
  </div>
</div><script>
/* ================== i18n strings ================== */
const STRINGS = {
  ar: {
    dashboard: 'لوحة المعلومات', projects: 'المشروعات', courses: 'الدورات', media: 'الوسائط', pages:'الصفحات', settings:'الإعدادات', importexport:'استيراد/تصدير', publish:'نشر', logout:'تسجيل خروج', preview:'عرض', export:'تصدير', loginTitle:'تسجيل دخول', loginBtn:'دخول', loginCancel:'إلغاء', addProject:'إضافة مشروع', addCourse:'إضافة دورة', save:'حفظ', delete:'حذف', siteTitle:'EVODESIGN'
  },
  en: {
    dashboard: 'Dashboard', projects: 'Projects', courses: 'Courses', media: 'Media', pages:'Pages', settings:'Settings', importexport:'Import/Export', publish:'Publish', logout:'Logout', preview:'Preview', export:'Export', loginTitle:'Admin Login', loginBtn:'Sign in', loginCancel:'Cancel', addProject:'Add Project', addCourse:'Add Course', save:'Save', delete:'Delete', siteTitle:'EVODESIGN'
  }
};

let LANG = localStorage.getItem('ev_lang') || 'ar';

// Save/load state (persistent localStorage) — structure supports bilingual content
const KEY = 'evodesign_cms_v1';
function defaultState(){
  return {
    meta:{siteTitle:{ar:'EVODESIGN',en:'EVODESIGN'}, tagline:{ar:'استوديو تصميم',en:'Creative Studio'}},
    pages:{home:{title:{ar:'الرئيسية',en:'Home'}, content:{ar:'<p>مرحبا بك في EVODESIGN</p>', en:'<p>Welcome to EVODESIGN</p>'}}, about:{title:{ar:'عني',en:'About'}, content:{ar:'<p>نبذة عني</p>', en:'<p>About me</p>'}}},
    projects:[], // each project: {id, title:{ar,en}, desc:{ar,en}, tags:[], media:[], published}
    courses:[],
    media:[],
    settings:{adminPass:'zino-admin', remote:false}
  };
}

function load(){try{const raw=localStorage.getItem(KEY); return raw? JSON.parse(raw): defaultState();}catch(e){return defaultState();}}
function save(){localStorage.setItem(KEY, JSON.stringify(STATE));}

let STATE = load();

// expose for debugging
window._EV = {STATE, save, load};

/* ================== UI helpers ================== */
const navButtons = document.querySelectorAll('.nav button');
const view = document.getElementById('view');
const toastEl = document.getElementById('toast');

function t(key){ return STRINGS[LANG][key] || key }

function showToast(msg, time=2500){ toastEl.textContent = msg; toastEl.style.display='block'; clearTimeout(toastEl._t); toastEl._t=setTimeout(()=> toastEl.style.display='none', time); }

/* ================== Language toggle ================== */
document.getElementById('lang-ar').addEventListener('click', ()=> setLang('ar'));
document.getElementById('lang-en').addEventListener('click', ()=> setLang('en'));
function setLang(l){ LANG = l; localStorage.setItem('ev_lang', l); document.getElementById('lang-ar').setAttribute('aria-pressed', l==='ar'); document.getElementById('lang-en').setAttribute('aria-pressed', l==='en'); renderCurrentView(); }

/* ================== Routing ================== */
navButtons.forEach(b=> b.addEventListener('click', ()=>{ navButtons.forEach(x=>x.classList.remove('active')); b.classList.add('active'); route(b.dataset.route); }));
function route(r){ if(!isAuthenticated() && r!=='login'){ showLogin(); return; } switch(r){case 'dashboard': renderDashboard(); break; case 'projects': renderProjects(); break; case 'courses': renderCourses(); break; case 'media': renderMedia(); break; case 'pages': renderPages(); break; case 'settings': renderSettings(); break; case 'importexport': renderImportExport(); break; case 'publish': renderPublish(); break; default: renderDashboard();}}

function renderCurrentView(){ // find active button and re-render
  const b = document.querySelector('.nav button.active'); if(b) route(b.dataset.route); else route('dashboard'); document.getElementById('app-title').textContent = STATE.meta.siteTitle[LANG]; }

/* ================== Auth ================== */
let AUTH = sessionStorage.getItem('ev_auth')=== '1';
function isAuthenticated(){ return AUTH }

function showLogin(){ document.getElementById('login-modal').style.display='flex'; document.getElementById('admin-pass-input').value=''; document.getElementById('login-title').textContent = t('loginTitle'); }
function hideLogin(){ document.getElementById('login-modal').style.display='none'; }

document.getElementById('login-cancel').addEventListener('click', ()=>{ hideLogin(); });
document.getElementById('login-ok').addEventListener('click', ()=>{ const val = document.getElementById('admin-pass-input').value; if(val === STATE.settings.adminPass){ AUTH = true; sessionStorage.setItem('ev_auth','1'); hideLogin(); renderCurrentView(); showToast('تم تسجيل الدخول'); } else { showToast('كلمة المرور خاطئة'); }});

document.getElementById('btn-logout').addEventListener('click', ()=>{ AUTH=false; sessionStorage.removeItem('ev_auth'); showToast('تم تسجيل الخروج'); showLogin(); });

/* ================== Dashboard ================== */
function renderDashboard(){ view.innerHTML = ''; const card = el('div',{class:'card'}, el('h2',{}, t('dashboard')) ); const stats = el('div',{class:'grid-3', style:'margin-top:12px'}, el('div',{class:'card'}, el('strong',{}, STATE.projects.length), el('div',{class:'muted'}, t('projects'))), el('div',{class:'card'}, el('strong',{}, STATE.courses.length), el('div',{class:'muted'}, t('courses'))), el('div',{class:'card'}, el('strong',{}, STATE.media.length), el('div',{class:'muted'}, t('media')))); view.appendChild(card); view.appendChild(stats); }

/* ================== Projects ================== */
function renderProjects(){ view.innerHTML=''; const header = el('div',{class:'card'}, el('h2',{}, t('projects')), el('div',{style:'margin-top:12px'}, el('label',{}, 'Title (AR)'), el('input',{id:'p-title-ar'}), el('label',{}, 'Title (EN)'), el('input',{id:'p-title-en'}), el('label',{}, 'Description (AR)'), el('textarea',{id:'p-desc-ar'}), el('label',{}, 'Description (EN)'), el('textarea',{id:'p-desc-en'}), el('div',{style:'display:flex;gap:8px;margin-top:8px'}, el('button',{class:'btn', onclick: addProject}, t('addProject')), el('button',{class:'btn ghost', onclick: ()=>{ exportSection('projects') }}, t('export')) )) ); view.appendChild(header);
  const list = el('div',{style:'margin-top:12px'});
  if(STATE.projects.length===0) list.appendChild(el('div',{}, 'لا توجد مشاريع'));
  STATE.projects.forEach((p, idx)=>{
    const card = el('div',{class:'card'}, el('h3',{}, p.title[LANG] || p.title['ar'] || ''), el('div',{class:'muted'}, p.desc[LANG] || p.desc['ar'] || ''), el('div',{style:'margin-top:8px;display:flex;gap:8px'}, el('button',{class:'btn', onclick: ()=> editProject(idx)}, t('save')), el('button',{class:'btn ghost', onclick: ()=> deleteProject(idx)}, t('delete')))); list.appendChild(card);
  });
  view.appendChild(list);
}

function addProject(){ const title_ar = document.getElementById('p-title-ar').value || 'بدون عنوان'; const title_en = document.getElementById('p-title-en').value || 'Untitled'; const desc_ar = document.getElementById('p-desc-ar').value || ''; const desc_en = document.getElementById('p-desc-en').value || ''; const p = {id: id('p_'), title:{ar:title_ar,en:title_en}, desc:{ar:desc_ar,en:desc_en}, tags:[], media:[], published:true}; STATE.projects.unshift(p); save(); showToast('تم إضافة مشروع'); renderProjects(); }

function editProject(i){ const p = STATE.projects[i]; const newTitleAr = prompt('Title AR', p.title.ar); const newTitleEn = prompt('Title EN', p.title.en); if(newTitleAr!==null) p.title.ar = newTitleAr; if(newTitleEn!==null) p.title.en = newTitleEn; save(); showToast('تم تعديل المشروع'); renderProjects(); }
function deleteProject(i){ if(!confirm('حذف المشروع؟')) return; STATE.projects.splice(i,1); save(); showToast('تم الحذف'); renderProjects(); }

/* ================== Courses ================== */
function renderCourses(){ view.innerHTML=''; const header = el('div',{class:'card'}, el('h2',{}, t('courses')), el('div',{style:'margin-top:12px'}, el('label',{}, 'Title (AR)'), el('input',{id:'c-title-ar'}), el('label',{}, 'Title (EN)'), el('input',{id:'c-title-en'}), el('label',{}, 'Description (AR)'), el('textarea',{id:'c-desc-ar'}), el('label',{}, 'Description (EN)'), el('textarea',{id:'c-desc-en'}), el('div',{style:'display:flex;gap:8px;margin-top:8px'}, el('button',{class:'btn', onclick: addCourse}, t('addCourse')), el('button',{class:'btn ghost', onclick: ()=>{ exportSection('courses') }}, t('export')) )) ); view.appendChild(header);
  const list = el('div',{style:'margin-top:12px'});
  if(STATE.courses.length===0) list.appendChild(el('div',{}, 'لا توجد دورات'));
  STATE.courses.forEach((c, idx)=>{ const card = el('div',{class:'card'}, el('h3',{}, c.title[LANG]||c.title['ar']), el('div',{class:'muted'}, c.desc[LANG]||c.desc['ar']), el('div',{style:'margin-top:8px;display:flex;gap:8px'}, el('button',{class:'btn', onclick: ()=> manageCourse(idx)}, 'Manage'), el('button',{class:'btn ghost', onclick: ()=> deleteCourse(idx)}, t('delete')))); list.appendChild(card); }); view.appendChild(list);
}
function addCourse(){ const title_ar = document.getElementById('c-title-ar').value || 'بدون عنوان'; const title_en = document.getElementById('c-title-en').value || 'Untitled'; const desc_ar = document.getElementById('c-desc-ar').value || ''; const desc_en = document.getElementById('c-desc-en').value || ''; const c = {id:id('c_'), title:{ar:title_ar,en:title_en}, desc:{ar:desc_ar,en:desc_en}, lessons:[], published:false}; STATE.courses.unshift(c); save(); showToast('تم إضافة دورة'); renderCourses(); }
function deleteCourse(i){ if(!confirm('حذف الدورة؟')) return; STATE.courses.splice(i,1); save(); showToast('تم الحذف'); renderCourses(); }

function manageCourse(i){ const c = STATE.courses[i]; const win = window.open('','_blank','width=900,height=700'); const html = `<html lang="${LANG=='ar'?'ar':'en'}" dir="${LANG=='ar'?'rtl':'ltr'}"><head><meta charset="utf-8"><title>Course Manager</title></head><body><h2>${escapeHtml(c.title[LANG])}</h2><p>${escapeHtml(c.desc[LANG])}</p><div id='lessons'></div></body></html>`; win.document.write(html); win.document.close(); }

/* ================== Media ================== */
function renderMedia(){ view.innerHTML=''; const cont = el('div',{class:'card'}, el('h2',{}, t('media')), el('div',{style:'margin-top:12px;display:flex;gap:8px;align-items:center'}, el('input',{type:'file',id:'media-file',accept:'image/*,video/*'}), el('button',{class:'btn', onclick: uploadMedia}, t('save')))); view.appendChild(cont); const grid = el('div',{class:'media-grid', style:'margin-top:12px'}); STATE.media.forEach((m, idx)=> grid.appendChild(el('div',{class:'media-item', style:`background-image:url('${m.src}')`}, el('button',{onclick: ()=>{ copyToClipboard(m.src); showToast('Copied'); }}, 'نسخ'), el('button',{onclick: ()=>{ STATE.media.splice(idx,1); save(); renderMedia(); }}, 'حذف')))); view.appendChild(grid); }

async function uploadMedia(){ const f = document.getElementById('media-file').files[0]; if(!f){ showToast('اختر ملف'); return;} const data = await fileToDataURL(f); STATE.media.unshift({id:id('m_'), name:f.name, type:f.type, src:data, uploadedAt: new Date().toISOString()}); save(); showToast('تم الرفع'); renderMedia(); }

/* ================== Pages ================== */
function renderPages(){ view.innerHTML=''; const card = el('div',{class:'card'}, el('h2',{}, t('pages')), el('label',{}, 'Home Title (AR)'), el('input',{id:'home-title-ar', value: STATE.pages.home.title.ar}), el('label',{}, 'Home Title (EN)'), el('input',{id:'home-title-en', value: STATE.pages.home.title.en}), el('label',{}, 'Home Content (AR)'), el('textarea',{id:'home-content-ar'}, STATE.pages.home.content.ar), el('label',{}, 'Home Content (EN)'), el('textarea',{id:'home-content-en'}, STATE.pages.home.content.en), el('div',{style:'margin-top:12px;display:flex;gap:8px'}, el('button',{class:'btn', onclick: ()=>{ STATE.pages.home.title.ar = document.getElementById('home-title-ar').value; STATE.pages.home.title.en = document.getElementById('home-title-en').value; STATE.pages.home.content.ar = document.getElementById('home-content-ar').value; STATE.pages.home.content.en = document.getElementById('home-content-en').value; save(); showToast('Saved'); }}, t('save')) )); view.appendChild(card); }

/* ================== Settings ================== */
function renderSettings(){ view.innerHTML=''; const s = STATE.settings; const card = el('div',{class:'card'}, el('h2',{}, t('settings')), el('label',{}, 'Admin Password'), el('input',{id:'setting-pass', value: s.adminPass}), el('label',{}, 'Enable Remote Storage'), el('select',{id:'setting-remote'}, el('option',{value:'0'}, 'No'), el('option',{value:'1'}, 'Yes')), el('div',{style:'margin-top:12px;display:flex;gap:8px'}, el('button',{class:'btn', onclick: ()=>{ s.adminPass = document.getElementById('setting-pass').value || s.adminPass; s.remote = document.getElementById('setting-remote').value==='1'; save(); showToast('Saved'); }}, t('save')) )); view.appendChild(card); }

/* ================== Import / Export ================== */
function renderImportExport(){ view.innerHTML=''; const card = el('div',{class:'card'}, el('h2',{}, t('importexport')), el('div',{style:'display:flex;gap:8px'}, el('button',{class:'btn', onclick: exportAll}, t('export')), el('button',{class:'btn ghost', onclick: ()=>{ const i = document.createElement('input'); i.type='file'; i.accept='application/json'; i.onchange=()=>{ const f = i.files[0]; const r = new FileReader(); r.onload=()=>{ try{ const parsed = JSON.parse(r.result); if(confirm('Replace local content?')){ STATE = parsed; save(); showToast('Imported'); renderCurrentView(); } }catch(e){ showToast('Bad file'); } }; r.readAsText(f); }; i.click(); }}, 'Import'))); view.appendChild(card); }

function exportAll(){ const data = JSON.stringify(STATE, null, 2); const blob = new Blob([data], {type:'application/json'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'evodesign_backup.json'; a.click(); URL.revokeObjectURL(a.href); showToast('Exported'); }

/* ================== Publish helpers ================== */
function renderPublish(){ view.innerHTML=''; const card = el('div',{class:'card'}, el('h2',{}, t('publish')), el('p',{class:'muted'}, 'Generate a static preview or sitemap'), el('div',{style:'display:flex;gap:8px'}, el('button',{class:'btn', onclick: generateStaticPreview}, 'Generate Preview'), el('button',{class:'btn ghost', onclick: ()=>{ const s = generateSitemap(); downloadTextFile(s, 'sitemap.xml'); showToast('sitemap.xml ready'); }}, 'sitemap.xml'))); view.appendChild(card); }
function generateStaticPreview(){ const html = generatePreviewHTML(); const w = window.open(); w.document.write(html); w.document.close(); showToast('Preview opened'); }
function generatePreviewHTML(){ const head = `<!doctype html><html lang="${LANG=='ar'?'ar':'en'}" dir="${LANG=='ar'?'rtl':'ltr'}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${escapeHtml(STATE.meta.siteTitle[LANG])}</title><style>body{font-family:Arial;padding:20px;background:#fff;color:#000}</style></head><body>`; const body = `<h1>${escapeHtml(STATE.meta.siteTitle[LANG])}</h1><section>${STATE.pages.home.content[LANG]}</section><h2>Projects</h2>${STATE.projects.map(p=>`<article><h3>${escapeHtml(p.title[LANG])}</h3><div>${escapeHtml(p.desc[LANG])}</div></article>`).join('')}<h2>Courses</h2>${STATE.courses.map(c=>`<article><h3>${escapeHtml(c.title[LANG])}</h3><div>${escapeHtml(c.desc[LANG])}</div></article>`).join('')}`; return head + body + '</body></html>'; }function generateSitemap(){ const base = location.origin; const urls = [base + '/']; STATE.projects.forEach(p=> urls.push(base + '/projects#' + p.id)); STATE.courses.forEach(c=> urls.push(base + '/courses#' + c.id)); let xml = '<?xml version="1.0" encoding="UTF-8"?> <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9"> '; urls.forEach(u=> xml += <url><loc>${u}</loc><lastmod>${new Date().toISOString()}</lastmod></url> ); xml += '</urlset>'; return xml; } function downloadTextFile(txt,name){ const b = new Blob([txt], {type:'text/plain'}); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = name; a.click(); URL.revokeObjectURL(a.href); }

/* ================== Utilities ================== */ function el(tag, props={}, ...children){ const e = document.createElement(tag); for(const k in props){ if(k==='class') e.className = props[k]; else if(k.startsWith('on') && typeof props[k] === 'function') e.addEventListener(k.slice(2), props[k]); else e.setAttribute(k, props[k]); } children.flat().forEach(c=>{ if(c==null) return; if(typeof c==='string' || typeof c==='number') e.appendChild(document.createTextNode(c)); else e.appendChild(c); }); return e; } function escapeHtml(s){ return (s||'').toString().replace(/[&<>"']/g, c=>({'&':'&','<':'<','>':'>','"':'"',"'":"'"})[c]); } function fileToDataURL(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload = ()=> res(r.result); r.onerror = rej; r.readAsDataURL(file); }); } function copyToClipboard(text){ navigator.clipboard?.writeText(text).catch(()=>{ const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }); }

/* ================== Small helpers ================== */ function id(pref='i'){return pref + Math.random().toString(36).slice(2,9)}

/* ================== initial render ================== */ setLang(LANG); renderCurrentView();

/* ================== event bindings top controls ================== */ document.getElementById('btn-preview').addEventListener('click', ()=> generateStaticPreview()); document.getElementById('btn-backup').addEventListener('click', ()=> exportAll());

/* ================== helper to export specific section ================== */ function exportSection(section){ const data = JSON.stringify(STATE[section], null, 2); const blob = new Blob([data], {type:'application/json'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = section + '.json'; a.click(); URL.revokeObjectURL(a.href); showToast('Exported'); }

/* ================== small functions used across ================== */ function renderCurrentView(){ const active = document.querySelector('.nav button.active'); if(active) route(active.dataset.route); else route('dashboard'); document.getElementById('app-title').textContent = STATE.meta.siteTitle[LANG]; document.getElementById('lang-ar').setAttribute('aria-pressed', LANG==='ar'); document.getElementById('lang-en').setAttribute('aria-pressed', LANG==='en'); }

/* ================== copy state for dev use ================== */ window.__STATE = ()=> JSON.parse(JSON.stringify(STATE));

</script>
